<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Two Body Problem</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      color: #fff;             
    }
    
    #simulationCanvas {
      display: block;
      background-color: #000; 
    }    
    canvas { display:block; }
    header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      color: #ffffff;
    }
    .controls {
      position:absolute; top:10px; left:10px;
      background:rgba(153,83,83,255);
      padding:15px; border-radius:6px;
      padding-top: 3px;
      font-family:sans-serif; font-size:14px;
      max-width: 320px;
    }

    .initial-reset-container {
      text-align: center;
    }
    
    .initial-reset-container {
      position: absolute;
      top: 10px;
      left: 100px;
      width: 320px;
      z-index: 200;              /* above the canvas */
      text-align: center;
    }
    .initial-reset-container button {
      padding: 6px 12px;
      /* …same styling as above… */
    }
    .slider-container { margin-bottom:10px; }
    .slider-label { margin-bottom:4px; display:block; }
    .toolbar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .toolbar-row {
      display: flex;
      gap: 8px;
    }
    
    .toolbar button {
      padding: 8px 12px;
      font-size: 14px;
    }


    button { padding:8px 12px; font-size:14px; margin-right:5px; }


  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <h1>THE KEPLER PROBLEM</h1>
  </header>

  <canvas id="simulationCanvas"></canvas>

  <div class="controls">
    <h2>Initial Conditions</h2>
    <h4>Body 1</h4>
    <div class="slider-container">
      <label class="slider-label">Mass (kg): <span id="mass1Value">5.972e24</span></label>
      <input id="mass1Slider" type="range" min="1e22" max="1e25" step="1e22" value="5.972e24">
    </div>
    <div class="slider-container">
      <label class="slider-label">Pos X (m): <span id="posX1Value">0</span></label>
      <input id="posX1Slider" type="range" min="-1000000" max="1000000" step="1000" value="0">
    </div>
    <div class="slider-container">
      <label class="slider-label">Pos Y (m): <span id="posY1Value">0</span></label>
      <input id="posY1Slider" type="range" min="-1000000" max="1000000" step="1000" value="0">
    </div>
    <div class="slider-container">
      <label class="slider-label">Vel X (m/s): <span id="velX1Value">0</span></label>
      <input id="velX1Slider" type="range" min="-10" max="10" step="0.1" value="0">
    </div>
    <div class="slider-container">
      <label class="slider-label">Vel Y (m/s): <span id="velY1Value">0</span></label>
      <input id="velY1Slider" type="range" min="-10" max="10" step="0.1" value="0">
    </div>

    <h4>Body 2</h4>
    <div class="slider-container">
      <label class="slider-label">Mass (kg): <span id="mass2Value">7.348e22</span></label>
      <input id="mass2Slider" type="range" min="1e22" max="1e25" step="1e22" value="7.348e22">
    </div>
    <div class="slider-container">
      <label class="slider-label">Pos X (m): <span id="posX2Value">384400</span></label>
      <input id="posX2Slider" type="range" min="-1000000000" max="1000000" step="1000" value="384400">
    </div>
    <div class="slider-container">
      <label class="slider-label">Pos Y (m): <span id="posY2Value">0</span></label>
      <input id="posY2Slider" type="range" min="-1000000" max="1000000" step="1000" value="0">
    </div>
    <div class="slider-container">
      <label class="slider-label">Vel X (m/s): <span id="velX2Value">0</span></label>
      <input id="velX2Slider" type="range" min="-10" max="10" step="0.1" value="0">
    </div>
    <div class="slider-container">
      <label class="slider-label">Vel Y (m/s): <span id="velY2Value">1.022</span></label>
      <input id="velY2Slider" type="range" min="-10" max="10" step="0.1" value="1.022">
    </div>

    <h4>Global</h4>
    <div class="slider-container">
      <label class="slider-label">G: <span id="gravityValue">6.6743e-11</span></label>
      <input id="gravitySlider" type="range" min="1e-15" max="1e-8" step="1e-15" value="6.6743e-11">
    </div>
    <div class="slider-container">
      <label class="slider-label">Time Step (s): <span id="stepValue">3600</span></label>
      <input id="stepSlider" type="range" min="60" max="86400" step="60" value="3600">
    </div>

  </div>

  <div class="toolbar">
    <div class="toolbar-row">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="centerBtn">Center</button>
      <button id="resetallBtn">Reset All</button>
    </div>
  
    <button id="toggleGraphBtn">Show Energy</button>
  </div>

  <div class="initial-reset-container">
    <button id="resetBtn">Reset</button>
  </div>


  <canvas id="energyChart"
  style="
    display:none;
    position:absolute;
    top:100px;
    right:10px;
    width:400px;
    height:200px;
    background:#fff;
    border:1px solid #ccc;
  ">
</canvas>

  <script src="nbody.js"></script>
  <script src="app.js"></script>
</body>
</html>
